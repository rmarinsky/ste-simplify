name: STE check
description: Check docs and instructions for Simplified Technical English (STE) with ste scan.
branding:
  icon: check-square
  color: blue
inputs:
  paths:
    description: Files or folders that ste scan examines. Put a space between two paths.
    default: "."
  args:
    description: More arguments for ste scan, for example "--fail-on warning --no-unknown".
    default: ""
  dictionary-b64:
    description: >
      Optional. If it is empty, the action runs "ste prepare", which downloads the PDF from ASD on the runner.
      Your STE dictionary as text (gzip, then Base64). Keep it in a repository secret. To make it, use the
      command "ste prepare --lite -o d.json && gzip -9c d.json | base64".
    default: ""
  dictionary-path:
    description: Optional. Path of a dictionary file on the runner.
    default: ""
  sarif:
    description: Path for a SARIF report. If it is empty, there is no SARIF report.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install ste
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Cache the dictionary
      if: inputs.dictionary-b64 == '' && inputs.dictionary-path == ''
      uses: actions/cache@v4
      with:
        path: ~/.config/ste-simplify
        key: ste-dictionary-issue9-${{ runner.os }}
    - name: Get the dictionary
      shell: bash
      env:
        STE_B64: ${{ inputs.dictionary-b64 }}
        STE_PATH: ${{ inputs.dictionary-path }}
      run: |
        if [ -n "$STE_PATH" ]; then
          echo "STE_DICTIONARY=$STE_PATH" >> "$GITHUB_ENV"
        elif [ -n "$STE_B64" ]; then
          mkdir -p "$RUNNER_TEMP/ste"
          printf '%s' "$STE_B64" | base64 -d | gunzip > "$RUNNER_TEMP/ste/dictionary.json"
          echo "STE_DICTIONARY=$RUNNER_TEMP/ste/dictionary.json" >> "$GITHUB_ENV"
        elif [ ! -f ~/.config/ste-simplify/dictionary.json ]; then
          command -v pdftotext >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; }
          ste prepare
        fi
    - name: Run ste scan
      shell: bash
      env:
        STE_PATHS: ${{ inputs.paths }}
        STE_ARGS: ${{ inputs.args }}
        STE_SARIF: ${{ inputs.sarif }}
      run: |
        set +e
        if [ -n "$STE_SARIF" ]; then
          ste scan $STE_ARGS --format sarif -o "$STE_SARIF" --fail-on never $STE_PATHS
        fi
        ste scan $STE_ARGS $STE_PATHS
