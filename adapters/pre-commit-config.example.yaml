# Add this to .pre-commit-config.yaml in your project.
# The hook reads the dictionary from ~/.config/ste-simplify/dictionary.json.gz or $STE_DICTIONARY.
# Build it one time: ste prepare
repos:
  - repo: https://github.com/rmarinsky/ste-simplify
    rev: v0.3.1
    hooks:
      - id: ste-check
        args: [--no-unknown]
        files: ^(docs/|README\.md|.*SKILL\.md|agents/)
