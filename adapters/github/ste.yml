# Copy this file to .github/workflows/ste.yml.
# Before you use it, add the repository secret STE_DICTIONARY_B64:
#   ste-build-dictionary --lite ASD-STE100.pdf -o ste-lite.json
#   gzip -9c ste-lite.json | base64 | gh secret set STE_DICTIONARY_B64
# The dictionary is copyrighted by ASD. Keep it in a secret. Do not commit it.
name: STE check
on:
  pull_request:
    paths: ["**/*.md", "**/*.mdx", "**/*.rst", "**/*.txt"]
permissions:
  contents: read
  security-events: write
jobs:
  ste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rmarinsky/ste-simplify@v0.1.0
        with:
          paths: "docs README.md"
          args: "--no-unknown"
          dictionary-b64: ${{ secrets.STE_DICTIONARY_B64 }}
          sarif: ste.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('ste.sarif') != ''
        with:
          sarif_file: ste.sarif
          category: ste
