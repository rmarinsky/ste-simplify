# Copy this file to .github/workflows/ste.yml.
# The action runs "ste prepare" on the runner: it downloads the PDF from the ASD web site and makes
# the dictionary for this run only. Do not commit the dictionary and do not upload it as an artifact.
name: STE scan
on:
  pull_request:
    paths: ["**/*.md", "**/*.mdx", "**/*.rst", "**/*.txt"]
permissions:
  contents: read
  security-events: write
jobs:
  ste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rmarinsky/ste-simplify@v0.3.1
        with:
          paths: "docs README.md"
          args: "--no-unknown"
          sarif: ste.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('ste.sarif') != ''
        with:
          sarif_file: ste.sarif
          category: ste
